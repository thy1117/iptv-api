# ==============================================================================
# IPTV-API 用户个性化配置 (针对 GitHub Actions 优化)
# ==============================================================================

# 开启更新
open_update = True

# 导出格式与数量：开启 M3U 结果导出，每个频道保留最流畅的 5 个有效接口
open_m3u_result = True
output_urls_limit = 5
urls_limit = 5

# 测速优化：使用快速测速模式，降低 GitHub Actions 执行时间与资源消耗
open_speed_test = True
speed_test_mode = quick
speed_test_timeout = 8
request_timeout = 8

# 接口过滤：过滤低于 0.5MB/s 的慢速源，过滤低于 720P 的模糊源，过滤无信号/广告循环源
open_filter_speed = True
min_speed = 0.5
open_filter_resolution = True
min_resolution = 1280x720
open_filter_ad = True

# 自动停用失效源：连续请求失败的地址自动前缀 # 停用，提升后续运行速度
open_auto_disable_source = True

# 节目单与台标支持
open_epg = True
open_subscribe_epg = True
open_subscribe_logo = True

# 网络类型：保留全部（IPv4 + IPv6）
ipv_type = all
ipv_type_prefer = auto

# 排序偏好：按下载速率从快到慢排序
sort_by = speed
