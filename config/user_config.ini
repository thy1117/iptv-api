[Settings]
# ==============================================================================
# IPTV-API 用户个性化配置 (仅保留 1080P 和 4K 超清画质)
# ==============================================================================

# 开启更新
open_update = True

# 开启未匹配频道分类：保留网络轮播（B站/虎牙/斗鱼/YY/抖音等）与特色频道，不测速直接输出
open_unmatch_category = True

# 导出格式与数量：开启 M3U 结果导出，每个频道保留最清晰的 5 个有效接口
open_m3u_result = True
output_urls_limit = 5
urls_limit = 5

# 排序核心：严格优先 4K，其次 1080P，同分辨率下按网速排序
sort_by = resolution,speed

# 分辨率严格筛选【核心要求：仅保留 1080P 和 4K，彻底过滤 720P 及以下画质】
open_filter_resolution = True
min_resolution = 1920x1080
max_resolution = 3840x2160

# 测速与速率过滤：降低跨国测试门槛，挽救被误杀的国内 1080P/4K 高清流
open_speed_test = True
speed_test_mode = quick
speed_test_timeout = 8
request_timeout = 8
open_filter_speed = True
min_speed = 0.2
resolution_speed_map = 1920x1080:0.2,3840x2160:0.5

# 过滤无信号/广告循环源
open_filter_ad = True

# 自动停用失效源：连续请求失败的地址自动前缀 # 停用，提升后续运行速度
open_auto_disable_source = True

# 节目单与台标支持
open_epg = True
open_subscribe_epg = True
open_subscribe_logo = True

# 网络类型：保留全部（IPv4 + IPv6）
ipv_type = all
ipv_type_prefer = auto
